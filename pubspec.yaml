name: tokona
description: "Smart POS Retail Store App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: ^0.19.0
  crypto: ^3.0.6
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  url_launcher: ^6.3.1
  postgres: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
